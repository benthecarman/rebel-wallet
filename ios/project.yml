name: App
options:
  bundleIdPrefix: ${IOS_BUNDLE_ID}
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  NwcMobileApple:
    url: https://github.com/ntheile/nwc-mobile
    revision: 61f1f7ce445ea45b3447aff6763993c7baeb51ce

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: ${IOS_BUNDLE_ID}
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: 5.0
    DEVELOPMENT_TEAM: ${IOS_DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: ${IOS_CODE_SIGN_STYLE}
    IOS_APS_ENVIRONMENT: ${IOS_APS_ENVIRONMENT}
    IOS_APP_GROUP_ID: ${IOS_APP_GROUP_ID}
    IOS_KEYCHAIN_ACCESS_GROUP: $(AppIdentifierPrefix)${IOS_BUNDLE_ID}
    NWC_WAKE_SERVER_URL: ${NWC_WAKE_SERVER_URL}
    INFOPLIST_PREPROCESS: YES
  configs:
    Debug:
      PRODUCT_BUNDLE_IDENTIFIER: ${IOS_BUNDLE_ID}
      INFOPLIST_PREPROCESSOR_DEFINITIONS: IOS_ALLOWS_LOCAL_NETWORKING=1
    Release:
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      CODE_SIGNING_ALLOWED: NO
      INFOPLIST_PREPROCESSOR_DEFINITIONS: IOS_ALLOWS_LOCAL_NETWORKING=0

targets:
  App:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: Sources
      - path: Bindings
        excludes:
          - "*.h"
          - "*.modulemap"
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: App.entitlements
    dependencies:
      - framework: Frameworks/RebelWalletCore.xcframework
        embed: false
      - package: NwcMobileApple
      - target: NotificationService
        embed: true

  NotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
      - path: NotificationService
      - path: Bindings
        excludes:
          - "*.h"
          - "*.modulemap"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${IOS_BUNDLE_ID}.NotificationService
        INFOPLIST_FILE: NotificationService/Info.plist
        CODE_SIGN_ENTITLEMENTS: NotificationService/NotificationService.entitlements
    dependencies:
      - framework: Frameworks/RebelWalletCore.xcframework
        embed: false
      - package: NwcMobileApple

schemes:
  App:
    build:
      targets:
        App: all
        NotificationService: all
