[package]
name = "rebel-wallet-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
regtest = []
nwc-diagnostics = ["nwc-mobile/diagnostics"]

[dependencies]
anyhow = "1"
base64 = "0.22"
bark = { package = "bark-wallet", version = "0.7.0", default-features = false, features = ["sqlite-bundled", "native", "tls-webpki-roots", "rand"] }
bech32 = "0.11"
bip39 = { version = "2", features = ["rand"] }
bitcoin = "0.32"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
flume = "0.11"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
lightning-invoice = "0.34"
nostr = { version = "0.45.0-alpha.1", features = ["nip04", "nip47"] }
nostr-sdk = "0.45.0-alpha.1"
# Update and audit ownership: ../docs/nwc-mobile-dependency.md
nwc-mobile = { git = "https://github.com/ntheile/nwc-mobile", rev = "61f1f7ce445ea45b3447aff6763993c7baeb51ce" }
nwc-mobile-bolt11 = { git = "https://github.com/ntheile/nwc-mobile", rev = "61f1f7ce445ea45b3447aff6763993c7baeb51ce" }
nwc-mobile-http = { git = "https://github.com/ntheile/nwc-mobile", rev = "61f1f7ce445ea45b3447aff6763993c7baeb51ce" }
nwc-mobile-nostr = { git = "https://github.com/ntheile/nwc-mobile", rev = "61f1f7ce445ea45b3447aff6763993c7baeb51ce" }
nwc-mobile-tokio = { git = "https://github.com/ntheile/nwc-mobile", rev = "61f1f7ce445ea45b3447aff6763993c7baeb51ce" }
nwc-mobile-uniffi = { git = "https://github.com/ntheile/nwc-mobile", rev = "61f1f7ce445ea45b3447aff6763993c7baeb51ce" }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls-webpki-roots"] }
rusqlite = { version = "0.31" }
secp256k1 = { version = "0.29", features = ["rand-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", default-features = false }
uniffi = "0.31.0"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
